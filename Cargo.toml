[package]
name = "zj-context-keys"
version = "0.1.1"
edition = "2021"
description = "Zellij plugin: context-aware keybindings dispatched by the focused pane's foreground process"
license = "MIT"
authors = ["Thiago Alves <thiago@rapinialves.com>"]
repository = "https://github.com/Townk/zj-context-keys"
homepage = "https://github.com/Townk/zj-context-keys"
readme = "README.md"
keywords = ["zellij", "plugin", "keybindings", "terminal", "wasm"]
categories = ["command-line-utilities"]

[lib]
name = "zj_context_keys"
path = "src/lib.rs"

[[bin]]
name = "zj-context-keys"
path = "src/main.rs"
# The binary is the WASM plugin entry point; its zellij-tile calls resolve to
# host shim symbols that only exist under wasm32-wasi. Excluding it from host
# test/bench builds keeps `cargo test` working (logic lives in the library).
test = false
bench = false

[dependencies]
zellij-tile = "0.44"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
